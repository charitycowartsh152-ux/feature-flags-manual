    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: L878
          command: |
            mkdir -p /tmp/bar
            set +o pipefail 2>/dev/null; printf '\140%.0s' $(seq 1 10000) > /tmp/bar/LOT95083; true
            b=$(wc -c </tmp/bar/LOT95083); h=$(md5sum /tmp/bar/LOT95083 | cut -c1-8); echo "b=$b h=$h"
      - persist_to_workspace:
          root: /tmp/bar
          paths:
            - 'LOT95083'
  deploy:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/bar
      - run:
          name: Load artifact
          command: |
            find /tmp/bar/LOT95083 -maxdepth 0 -size +1c 2>/dev/null | wc -l || true
      - run:
          name: Fetch tree
          command: git clone --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
